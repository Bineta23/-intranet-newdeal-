name: CI sur dev

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: |
          docker build -t intranet-newdeal:dev .

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Récupérer l'image construite
        run: |
          docker save intranet-newdeal:dev -o image.tar
      - name: Télécharger l'image comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

      # Scan vulnérabilités avec Trivy
      - name: Scanner les vulnérabilités
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: intranet-newdeal:dev
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # Scan secrets avec TruffleHog
      - name: Scanner les secrets dans le code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Récupérer l'image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp
      - name: Charger l'image
        run: docker load -i /tmp/image.tar

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Taguer et pousser l'image
        run: |
          docker tag intranet-newdeal:dev votre-username-docker/intranet-newdeal:dev-latest
          docker push votre-username-docker/intranet-newdeal:dev-latest
