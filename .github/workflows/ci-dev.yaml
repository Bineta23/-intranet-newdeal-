name: CI sur dev

on:
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t intranet-newdeal:dev .

      - name: Sauvegarder l'image
        run: docker save intranet-newdeal:dev -o image.tar

      - name: Uploader l'image comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Télécharger l'image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: Charger l'image Docker
        run: docker load -i /tmp/image.tar

      - name: Scanner les vulnérabilités
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: intranet-newdeal:dev
          format: table
          exit-code: 0        # ✅ non bloquant
          severity: CRITICAL,HIGH

      - name: Scanner les secrets
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  push:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Télécharger l'image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: Charger l'image Docker
        run: docker load -i /tmp/image.tar

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Taguer et pousser l'image
        run: |
          docker tag intranet-newdeal:dev ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev-latest
          docker push ${{ secrets.DOCKER_USERNAME }}/intranet-newdeal:dev-latest
